<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Store - Registro</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="auth-body">
    <div class="auth-container">
      <header>
        <h1>Food Store</h1>
        <p>Crear Cuenta</p>
      </header>

      <main>
        <form id="form-registro">
          <div class="form-group">
            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" required placeholder="tucorreo@email.com" />
          </div>

          <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" required placeholder="********" />
          </div>

          <button type="submit" class="btn-primary">Registrarse</button>
        </form>

        <p class="auth-link" style="margin-top: 1rem; text-align: center;">
          ¿Ya tenés cuenta? <a href="../../">Iniciá sesión</a>
        </p>
      </main>
    </div>

    <script type="module" src="../registro/registro.ts"></script>
  </body>
</html>
