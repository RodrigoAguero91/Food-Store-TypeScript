<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Store - Iniciar Sesión</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="auth-body">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Food Store</h1>
        <p>Iniciar Sesión</p>
      </div>

      <form id="form-login" class="auth-form">
        <div class="form-group">
          <label for="email">Correo Electrónico:</label>
          <input type="email" id="email" required placeholder="tucorreo@email.com" />
        </div>

        <div class="form-group">
          <label for="password">Contraseña:</label>
          <input type="password" id="password" required placeholder="********" />
        </div>

        <button type="submit" class="btn-primary">Ingresar</button>
      </form>

      <p class="auth-footer-link">
        ¿No tenés cuenta? <a href="/src/pages/auth/registro/index.html">Registrate acá</a>
      </p>
    </div>

    <script type="module" src="./users.ts"></script>
  </body>
</html>
