<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Store - Panel Administrador</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="header-tienda">
      <div class="logo">
        <h1>
          <a href="../client/home/home.html" style="color: white; text-decoration: none;">
            Panel Admin - Food Store
          </a>
        </h1>
      </div>
      <nav class="nav-links">
        <a href="../client/home/home.html">Ir a la Tienda</a>
        <a href="../client/cart/cart.html">Carrito</a>
        <a href="../orders/orders.html">Mis Pedidos</a>
        <span id="user-info" class="user-badge"></span>
        <button id="btn-logout" class="btn-logout">Cerrar Sesión</button>
      </nav>
    </header>

    <main class="admin-main">
      <h2>Gestión de la Tienda</h2>

      <section class="admin-panel">
        <h3>Alta de Categoría</h3>
        <form id="form-categoria" class="admin-form-inline">
          <input type="text" id="cat-nombre" required placeholder="Nombre categoría" />
          <input type="text" id="cat-desc" placeholder="Descripción (opcional)" />
          <button type="submit" class="btn-primary">Crear Categoría</button>
        </form>
        <div id="admin-categories-list" class="admin-tags"></div>
      </section>

      <section class="admin-panel">
        <h3>Alta / Edición de Producto</h3>
        <form id="form-producto" class="admin-form-grid">
          <input type="hidden" id="prod-id" />
          <input type="text" id="prod-nombre" required placeholder="Nombre del producto" />
          <select id="prod-categoria" required></select>
          <input type="number" id="prod-precio" step="0.01" min="0.01" required placeholder="Precio (> 0)" />
          <input type="number" id="prod-stock" min="0" required placeholder="Stock (>= 0)" />
          <input type="text" id="prod-desc" placeholder="Descripción" />
          <label class="checkbox-label">
            <input type="checkbox" id="prod-disponible" checked />
            Disponible
          </label>
          <div class="form-actions">
            <button type="submit" id="btn-save-prod" class="btn-primary">Guardar Producto</button>
            <button type="button" id="btn-cancel-edit" class="btn-secondary" style="display: none;">Cancelar</button>
          </div>
        </form>

        <h4>Productos Activos</h4>
        <div id="admin-products-list" class="admin-table-wrap"></div>
      </section>

      <section class="admin-panel">
        <h3>Pedidos Registrados</h3>
        <div id="admin-orders-list" class="orders-list"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Food Store. Todos los derechos reservados.</p>
    </footer>

    <script type="module" src="./admin.ts"></script>
  </body>
</html>
